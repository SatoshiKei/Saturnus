<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Saturnus">
  <defs>
    <clipPath id="saturn-ring-top">
      <rect x="-20" y="-12" width="40" height="12"/>
    </clipPath>
    <clipPath id="saturn-ring-bottom">
      <rect x="-20" y="0" width="40" height="12"/>
    </clipPath>
    <radialGradient id="saturn-shade" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#000"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="32" height="32" fill="#0e1116" rx="7"/>
  <g transform="translate(16,16.5) rotate(-22)">
    <ellipse
      cx="0"
      cy="0"
      rx="12.5"
      ry="4.1"
      fill="none"
      stroke="#7a5a24"
      stroke-width="1.65"
      clip-path="url(#saturn-ring-top)"
    />
    <circle r="5.6" fill="#c8963e"/>
    <circle r="5.6" fill="url(#saturn-shade)" opacity="0.22"/>
    <ellipse
      cx="0"
      cy="0"
      rx="12.5"
      ry="4.1"
      fill="none"
      stroke="#e4b85a"
      stroke-width="1.65"
      clip-path="url(#saturn-ring-bottom)"
    />
  </g>
</svg>