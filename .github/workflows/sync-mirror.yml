name: sync-mirror

on:
  push:
    branches:
      - master
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  sync:
    if: github.repository == 'SatoshiKei/Saturnus'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: push-to-mirror
        env:
          MIRROR_TOKEN: ${{ secrets.MIRROR_TOKEN }}
        run: |
          if [ -z "$MIRROR_TOKEN" ]; then
            echo "MIRROR_TOKEN ausente"
            exit 1
          fi
          git push --force "https://x-access-token:${MIRROR_TOKEN}@github.com/Oicanji/decifrathon-saturnus.git" "HEAD:master"
